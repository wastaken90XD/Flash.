name: fetch-references
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  fetch-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and fetch references from references.lock
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, tomllib, urllib.request

          lock_path = pathlib.Path("references.lock")
          data = tomllib.loads(lock_path.read_text())
          summary_lines = ["### Reference Verification Summary", "", "| Name | Commit | SHA-256 | Status |", "| :--- | :--- | :--- | :--- |"]

          for ref in data.get("ref", []):
              name = ref["name"]
              url = ref["url"]
              expected_sha = ref.get("sha256", "")
              dest = pathlib.Path(ref["dest"])
              commit_flag = bool(ref.get("commit", False))

              req = urllib.request.Request(url, headers={"User-Agent": "swfr-fetch-references/1.0"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = resp.read()

              actual_sha = hashlib.sha256(body).hexdigest()
              if expected_sha and actual_sha != expected_sha:
                  raise SystemExit(f"SHA-256 mismatch for {name}: expected {expected_sha}, got {actual_sha}")

              if commit_flag:
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(body)
                  status = f"Committed to `{dest}`"
              else:
                  status = "Reachable (not committed)"

              summary_lines.append(f"| `{name}` | `{commit_flag}` | `{actual_sha[:16]}…` | {status} |")

          summary_file = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]) if "GITHUB_STEP_SUMMARY" in __import__("os").environ else None
          if summary_file:
              summary_file.write_text("\n".join(summary_lines) + "\n")
          print("\n".join(summary_lines))
          PY
