name: lockfile

on:
  push:
    branches:
      - main
      - "m[0-9]/**"
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Generate Cargo.lock & Provisional Goldens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate Cargo.lock, provisional goldens, and format
        run: |
          cargo generate-lockfile
          cargo test -p swfr-render --test render_goldens
          cargo fmt --all

      - name: Commit and push if changed
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock crates/swfr-render/tests/golden-provisional/
            git add -u
            git commit -m "chore(ci): update Cargo.lock and provisional goldens"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
