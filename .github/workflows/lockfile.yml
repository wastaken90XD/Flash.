name: lockfile
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "rust-toolchain.toml"
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - run: rustup show
      - name: Generate Cargo.lock, format workspace, and verify fetch
        run: |
          cargo fmt --all
          cargo generate-lockfile
          cargo fetch --locked
      - name: Commit updated Cargo.lock and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Workspace and Cargo.lock are already up to date."
          else
            git commit -m "chore: update Cargo.lock and rustfmt"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
