name: lockfile

on:
  push:
    branches:
      - main
      - "m[0-9]/**"
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-lockfile:
    name: Generate Cargo.lock & Provisional Goldens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate Cargo.lock, provisional goldens, and format
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "=== cargo generate-lockfile ==="
            cargo generate-lockfile 2>&1
            echo "=== cargo fmt --all ==="
            cargo fmt --all 2>&1
            echo "=== cargo test -p swfr-render --test render_goldens ==="
            cargo test -p swfr-render --test render_goldens 2>&1
            echo "=== cargo clippy --workspace --all-targets -- -D warnings ==="
            cargo clippy --workspace --all-targets -- -D warnings 2>&1
            echo "=== cargo test --workspace --exclude swfr-libretro ==="
            cargo test --workspace --exclude swfr-libretro 2>&1
          } > /tmp/lockfile-diag.txt
          set -e

          # Post diagnostic summary to PR #1 if any error occurred
          if grep -qE "^error(\[|:)" /tmp/lockfile-diag.txt || grep -q "FAILED" /tmp/lockfile-diag.txt; then
            {
              printf '%s\n' "<!-- swfr-lockfile-diag -->"
              printf '%s\n' "### Cargo Build & Test Diagnostics (\`${GITHUB_SHA}\`)"
              printf '%s\n' '```text'
              tail -n 160 /tmp/lockfile-diag.txt
              printf '%s\n' '```'
            } > /tmp/diag-comment.md
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" -F body=@/tmp/diag-comment.md >/dev/null || true
          fi

      - name: Commit and push if changed
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock crates/swfr-render/tests/golden-provisional/ || true
            git add -u
            git commit -m "chore(ci): update Cargo.lock and provisional goldens"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
