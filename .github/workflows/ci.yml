name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lints:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.cap.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: |
          set -eo pipefail
          cargo fmt --all --check 2>&1 | tee /tmp/lints.log
          cargo clippy --workspace --locked -- -D warnings 2>&1 | tee -a /tmp/lints.log
      - name: Verify deps-allow.txt, unsafe boundary, and manifests
        run: |
          python3 - <<'PY' 2>&1 | tee -a /tmp/lints.log
          import json, re, subprocess, sys, tomllib
          from pathlib import Path

          allowed = {
              line.strip()
              for line in Path("deps-allow.txt").read_text().splitlines()
              if line.strip() and not line.strip().startswith("#")
          }

          meta_raw = subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--locked", "--format-version", "1"],
              text=True,
          )
          meta = json.loads(meta_raw)
          workspace_names = {pkg["name"] for pkg in meta["packages"]}

          unexpected = set()
          for pkg in meta["packages"]:
              for dep in pkg["dependencies"]:
                  dep_name = dep["name"]
                  if dep_name in workspace_names:
                      continue
                  if dep_name not in allowed:
                      unexpected.add(f"{pkg['name']} -> {dep_name}")

          root_toml = tomllib.loads(Path("Cargo.toml").read_text())
          ws_deps = {
              k for k in root_toml.get("workspace", {}).get("dependencies", {}).keys()
              if k not in workspace_names
          }

          if unexpected:
              print(f"ERROR: Unapproved direct dependencies: {sorted(unexpected)}", file=sys.stderr)
              sys.exit(1)

          if ws_deps != allowed:
              print(
                  f"ERROR: Root Cargo.toml [workspace.dependencies] ({sorted(ws_deps)}) "
                  f"does not match deps-allow.txt ({sorted(allowed)})",
                  file=sys.stderr,
              )
              sys.exit(1)

          allowed_ffi = {
              Path("crates/swfr-libretro/src/ffi.rs"),
              Path("crates/swfr-libretro/src/lib.rs"),
          }
          unsafe_pat = re.compile(r"\bunsafe\b|allow\s*\(\s*unsafe_code\s*\)")
          for rs_path in sorted(Path("crates").rglob("*.rs")):
              if rs_path in allowed_ffi:
                  continue
              for lineno, line in enumerate(rs_path.read_text().splitlines(), 1):
                  code = line.split("//", 1)[0]
                  if unsafe_pat.search(code):
                      print(f"ERROR: Forbidden unsafe outside ffi at {rs_path}:{lineno}: {line}", file=sys.stderr)
                      sys.exit(1)

          manifest = tomllib.loads(Path("corpus/real/MANIFEST.toml").read_text())
          for entry in manifest.get("file", []):
              if not entry.get("license") or not entry.get("sha256") or not entry.get("url"):
                  print(f"ERROR: Invalid corpus entry missing license/sha256/url: {entry}", file=sys.stderr)
                  sys.exit(1)

          print(f"OK: {len(allowed)} allowed external dependencies and strict ffi unsafe boundary verified.")
          PY
      - name: Capture output
        id: cap
        if: always()
        run: |
          {
            echo "report<<EOF"
            tail -n 40 /tmp/lints.log 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-test:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.cap.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: |
          set -eo pipefail
          cargo fmt --all --check 2>&1 | tee /tmp/build.log
          cargo clippy --workspace --locked -- -D warnings 2>&1 | tee -a /tmp/build.log
          cargo test --workspace --locked 2>&1 | tee -a /tmp/build.log
          cargo run -p swfr-harness --locked -- info 2>&1 | tee -a /tmp/build.log
      - name: Capture output
        id: cap
        if: always()
        run: |
          {
            echo "report<<EOF"
            tail -n 40 /tmp/build.log 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: cargo test -p swfr-libretro --locked
      - run: cargo test -p swfr-libretro --features fault-inject --locked

  cross-build:
    runs-on: ubuntu-latest
    outputs:
      size_bytes: ${{ steps.size.outputs.size_bytes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: cargo build --release -p swfr-libretro --locked
      - name: Check core library size budget (< 6 MB)
        id: size
        run: |
          size_bytes=$(stat -c%s target/release/libswfr_libretro.so)
          echo "size_bytes=${size_bytes}" >> "$GITHUB_OUTPUT"
          if [ "$size_bytes" -ge 6291456 ]; then
            echo "ERROR: Core library size ${size_bytes} exceeds 6 MB budget" >&2
            exit 1
          fi

  ci-report:
    needs: [lints, build-test, abi, cross-build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post or update sticky ci-report comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RES_LINTS: ${{ needs.lints.result }}
          RES_BUILD: ${{ needs.build-test.result }}
          RES_ABI: ${{ needs.abi.result }}
          RES_CROSS: ${{ needs.cross-build.result }}
          LINTS_LOG: ${{ needs.lints.outputs.report }}
          BUILD_LOG: ${{ needs.build-test.outputs.report }}
          CORE_SIZE: ${{ needs.cross-build.outputs.size_bytes }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          sha = os.environ["SHA"][:7]
          core_size = os.environ.get("CORE_SIZE", "n/a")
          lines = [
              "<!-- ci-report -->",
              f"### `ci-report` (`{sha}`)",
              "",
              "| Job | Result | Notes |",
              "| :--- | :--- | :--- |",
              f"| `lints` | `{os.environ['RES_LINTS']}` | Format, Clippy, allowlist & `ffi` boundary |",
              f"| `build-test` | `{os.environ['RES_BUILD']}` | Workspace unit tests & `swfr-harness` |",
              f"| `abi` | `{os.environ['RES_ABI']}` | `libretro.h` check, mock frontend & fault injection |",
              f"| `cross-build` | `{os.environ['RES_CROSS']}` | `libswfr_libretro.so`: `{core_size}` bytes (budget `< 6 MB`) |",
          ]
          if os.environ["RES_LINTS"] != "success":
              lines.extend(["", "#### `lints` output (last 40 lines)", "```text", os.environ.get("LINTS_LOG", ""), "```"])
          if os.environ["RES_BUILD"] != "success":
              lines.extend(["", "#### `build-test` output (last 40 lines)", "```text", os.environ.get("BUILD_LOG", ""), "```"])
          body = "\n".join(lines)

          comments_raw = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/issues/{pr}/comments"],
              text=True,
          )
          comments = json.loads(comments_raw)
          existing_id = None
          for c in comments:
              if "<!-- ci-report -->" in c.get("body", ""):
                  existing_id = c["id"]
                  break

          if existing_id:
              subprocess.check_call([
                  "gh", "api", "-X", "PATCH",
                  f"repos/{repo}/issues/comments/{existing_id}",
                  "-f", f"body={body}",
              ])
          else:
              subprocess.check_call([
                  "gh", "api", "-X", "POST",
                  f"repos/{repo}/issues/{pr}/comments",
                  "-f", f"body={body}",
              ])
          PY
