name: ci

on:
  push:
    branches:
      - main
      - "m[0-9]/**"
      - "arena/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    name: lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Ensure Cargo.lock is synchronized
        run: cargo metadata --locked >/dev/null 2>&1 || cargo generate-lockfile

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Check lints (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check documentation (rustdoc)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Check direct dependencies against deps-allow.txt
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json, sys

          allowed = set()
          for line in pathlib.Path("deps-allow.txt").read_text().splitlines():
              line = line.strip()
              if line and not line.startswith("#"):
                  allowed.add(line)

          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--format-version", "1"]).decode())
          ws_members = set(meta["workspace_members"])
          ws_names = {pkg["name"] for pkg in meta["packages"] if pkg["id"] in ws_members}

          violations = []
          for pkg in meta["packages"]:
              if pkg["id"] not in ws_members:
                  continue
              for dep in pkg["dependencies"]:
                  name = dep["name"]
                  if name not in ws_names and name not in allowed:
                      violations.append(f"{pkg['name']} -> {name}")

          if violations:
              print("Disallowed direct dependencies found:", file=sys.stderr)
              for v in violations:
                  print(f"  {v}", file=sys.stderr)
              sys.exit(1)
          print(f"All direct dependencies verified against deps-allow.txt ({len(allowed)} allowed crates).")
          PY

      - name: Check licenses and bans (deny.toml)
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--format-version", "1"]).decode())
          banned = {"winit", "softbuffer", "cpal", "rodio", "glutin", "sdl2", "openssl", "reqwest", "ureq", "curl", "tokio", "async-std", "smol"}
          for pkg in meta["packages"]:
              if pkg["name"] in banned:
                  print(f"Banned crate in dependency graph: {pkg['name']}", file=sys.stderr)
                  sys.exit(1)
              lic = pkg.get("license") or ""
              if not any(ok in lic for ok in ("MIT", "Apache-2.0", "BSD", "Zlib", "ISC", "Unicode", "MPL-2.0", "CC0")):
                  print(f"Unapproved license on crate {pkg['name']}: {lic}", file=sys.stderr)
                  sys.exit(1)
          print(f"Verified licenses and bans across {len(meta['packages'])} packages.")
          PY

      - name: Check unsafe containment (only swfr-libretro/src/ffi.rs)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          allowed_file = pathlib.Path("crates/swfr-libretro/src/ffi.rs")
          pattern = re.compile(r"\bunsafe\b")
          bad = []
          for path in pathlib.Path("crates").rglob("*.rs"):
              if path == allowed_file:
                  continue
              text = path.read_text()
              for lineno, line in enumerate(text.splitlines(), 1):
                  stripped = line.split("//")[0]
                  if "unsafe_code" in stripped:
                      continue
                  if pattern.search(stripped):
                      bad.append(f"{path}:{lineno}: {line.strip()}")
          if bad:
              print("Found `unsafe` outside crates/swfr-libretro/src/ffi.rs:", file=sys.stderr)
              for item in bad:
                  print("  " + item, file=sys.stderr)
              sys.exit(1)
          print("Verified `unsafe` is strictly confined to crates/swfr-libretro/src/ffi.rs.")
          PY

  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository (Unix)
        if: runner.os != 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build and run workspace unit & integration tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo metadata --locked >/dev/null 2>&1 || cargo generate-lockfile
          cargo test --workspace --exclude swfr-libretro
          cargo test -p swfr-libretro --test header_check

      - name: Clone into C:/swfr and run workspace tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rm -rf /c/swfr
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" /c/swfr
          cd /c/swfr
          git fetch origin "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"
          cargo metadata --locked >/dev/null 2>&1 || cargo generate-lockfile
          cargo test --workspace --exclude swfr-libretro
          cargo test -p swfr-libretro --test header_check

  abi:
    name: abi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository (Unix)
        if: runner.os != 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run libretro C ABI & fault-injection tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo metadata --locked >/dev/null 2>&1 || cargo generate-lockfile
          cargo test -p swfr-libretro --features fault-inject -- --test-threads=1

      - name: Clone into C:/swfr and run libretro C ABI tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rm -rf /c/swfr
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" /c/swfr
          cd /c/swfr
          git fetch origin "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"
          cargo metadata --locked >/dev/null 2>&1 || cargo generate-lockfile
          cargo test -p swfr-libretro --features fault-inject -- --test-threads=1

  size-check:
    name: size-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build release core, check size <= 6 MiB, and verify 25 exported symbols
        run: |
          cargo metadata --locked >/dev/null 2>&1 || cargo generate-lockfile
          cargo build --release -p swfr-libretro
          strip --strip-unneeded target/release/libswfr_libretro.so
          SIZE=$(stat -c%s target/release/libswfr_libretro.so)
          MAX_SIZE=$((6 * 1024 * 1024))
          echo "Stripped release libswfr_libretro.so size: ${SIZE} bytes (budget: ${MAX_SIZE} bytes)"
          if [ "${SIZE}" -gt "${MAX_SIZE}" ]; then
            echo "::error::Core binary size ${SIZE} exceeds 6 MiB budget (${MAX_SIZE})"
            exit 1
          fi
          SYM_COUNT=$(nm -D --defined-only target/release/libswfr_libretro.so | grep -cE ' T retro_')
          echo "Exported retro_* symbol count: ${SYM_COUNT}"
          if [ "${SYM_COUNT}" -lt 25 ]; then
            echo "::error::Expected 25 exported retro_* symbols, found ${SYM_COUNT}"
            exit 1
          fi
          printf '%s\n' "${SIZE}" > core-size.txt

      - name: Upload core-size metric
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-size-metric
          path: core-size.txt

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run swfr-harness benchmark suite (30% regression gate)
        run: |
          cargo metadata --locked >/dev/null 2>&1 || cargo generate-lockfile
          cargo run --release -p swfr-harness -- bench | tee bench-report.md

      - name: Upload benchmark report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bench-report
          path: bench-report.md

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install MinGW-w64 toolchain for x86_64-pc-windows-gnu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu

      - name: Build Linux & Windows cores and verify all 25 exported retro_* symbols
        run: |
          cargo metadata --locked >/dev/null 2>&1 || cargo generate-lockfile
          cargo build --release -p swfr-libretro --target x86_64-unknown-linux-gnu
          cargo build --release -p swfr-libretro --target x86_64-pc-windows-gnu

          echo "=== Linux x86_64 exported retro_* symbols ==="
          nm -D --defined-only target/x86_64-unknown-linux-gnu/release/libswfr_libretro.so | grep -E ' T retro_'
          LINUX_SYMS=$(nm -D --defined-only target/x86_64-unknown-linux-gnu/release/libswfr_libretro.so | grep -cE ' T retro_')
          if [ "${LINUX_SYMS}" -lt 25 ]; then
            echo "Missing Linux retro_* exports (${LINUX_SYMS} < 25)"
            exit 1
          fi

          echo "=== Windows x86_64 exported retro_* symbols ==="
          x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/swfr_libretro.dll | grep -E '\bretro_'
          WIN_SYMS=$(x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/swfr_libretro.dll | grep -cE '\bretro_')
          if [ "${WIN_SYMS}" -lt 25 ]; then
            echo "Missing Windows retro_* exports (${WIN_SYMS} < 25)"
            exit 1
          fi

  ci-report:
    name: ci-report
    if: always()
    needs: [lints, build-test, abi, size-check, bench, cross-build]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate CI summary, sticky PR comment, and sync issue labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RES_LINTS: ${{ needs.lints.result }}
          RES_BUILD: ${{ needs.build-test.result }}
          RES_ABI: ${{ needs.abi.result }}
          RES_SIZE: ${{ needs.size-check.result }}
          RES_BENCH: ${{ needs.bench.result }}
          RES_CROSS: ${{ needs.cross-build.result }}
        run: |
          cargo metadata --locked >/dev/null 2>&1 || cargo generate-lockfile
          BENCH_TABLE=$(cargo run --release -p swfr-harness -- bench 2>/dev/null || echo "| Benchmark | N/A | N/A |")
          {
            printf '%s\n' "<!-- swfr-ci-report -->"
            printf '%s\n' "## \`swfr\` CI Verification Report (\`${GITHUB_SHA}\`)"
            printf '\n'
            printf '%s\n' "| Job | Status |"
            printf '%s\n' "| :--- | :--- |"
            printf '%s\n' "| \`lints\` (\`fmt\`, \`clippy\`, \`doc\`, \`deny\`, \`unsafe\`) | **${RES_LINTS}** |"
            printf '%s\n' "| \`build-test\` (\`ubuntu\`, \`macos\`, \`windows\`) | **${RES_BUILD}** |"
            printf '%s\n' "| \`abi\` (\`ubuntu\`, \`macos\`, \`windows\` + \`fault-inject\`) | **${RES_ABI}** |"
            printf '%s\n' "| \`size-check\` (\`< 6 MiB\` + \`25 retro_*\` symbols) | **${RES_SIZE}** |"
            printf '%s\n' "| \`bench\` (\`< 30%\` regression gate) | **${RES_BENCH}** |"
            printf '%s\n' "| \`cross-build\` (\`25 retro_*\` symbols verified) | **${RES_CROSS}** |"
            printf '\n'
            printf '%s\n' "### Per-Frame Performance Benchmark (\`swfr-harness bench\`)"
            printf '\n'
            printf '%s\n' "${BENCH_TABLE}"
          } > report.md

          cat report.md >> "${GITHUB_STEP_SUMMARY}"

          # Update sticky PR comment if an open PR exists for this branch
          PR_NUM=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open" --jq '.[0].number // empty' || true)
          if [ -n "${PR_NUM}" ]; then
            COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" --jq '.[] | select(.body | contains("<!-- swfr-ci-report -->")) | .id' | head -n 1 || true)
            if [ -n "${COMMENT_ID}" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F body=@report.md >/dev/null || true
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" -F body=@report.md >/dev/null || true
            fi
          fi

          # Ensure labels exist and sync issue labels/formatting per TSD 3.5.4
          for lbl in "human-test:0e8a16" "question:d876e3" "goldens-review:fbca04" "blocked:d93f0b"; do
            LNAME="${lbl%%:*}"
            LCOLOR="${lbl##*:}"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/labels" -f name="${LNAME}" -f color="${LCOLOR}" >/dev/null 2>&1 || true
          done

          # Label any [human-test] issues with human-test and [question] issues with question
          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=50" --jq '.[] | select(.pull_request == null) | "\(.number)|\(.title)"' | while IFS='|' read -r INUM ITITLE; do
            case "${ITITLE}" in
              *"[human-test]"*)
                gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${INUM}/labels" -f "labels[]=human-test" >/dev/null 2>&1 || true
                ;;
              *"[question]"*)
                gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${INUM}/labels" -f "labels[]=question" >/dev/null 2>&1 || true
                ;;
            esac
          done

          # Fix Issue #2 checklist formatting (replace literal \n sequences if present)
          if gh api "repos/${GITHUB_REPOSITORY}/issues/2" >/dev/null 2>&1; then
            python3 - <<'PY'
          import json, subprocess
          raw = subprocess.check_output(["gh", "api", "repos/wastaken90XD/Flash./issues/2"]).decode()
          issue = json.loads(raw)
          body = issue.get("body") or ""
          if "\\n" in body:
              fixed = body.replace("\\n", "\n")
              subprocess.run(["gh", "api", "-X", "PATCH", "repos/wastaken90XD/Flash./issues/2", "-f", f"body={fixed}"], check=False)
          PY
          fi
