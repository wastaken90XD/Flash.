[package]
name = "swfr-libretro"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
fault-inject = []
m0-stub = ["swfr-player/m0-stub"]

[dependencies]
swfr-player.workspace = true

[dev-dependencies]
swfr-reader.workspace = true
swfr-swf.workspace = true
swfr-testkit.workspace = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
arithmetic_side_effects = "warn"
